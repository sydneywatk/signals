# Pipeline tuning parameters. Mutable without code changes.
# Loaded by src/signals/settings.py via load_pipeline_config().

pipeline:
  schedule_hours: 6

  lookback_days:
    bills: 14
    filings_8k: 14
    lda_registrations: 60
    model_bill_propagation: 365

  # Thresholds tuned for sentence-transformers all-MiniLM-L6-v2 cosine.
  # (Voyage was the first choice but free-tier rate-limits made it unusable —
  # see DECISION_MEMO.) Same-topic cross-state bills cluster around 0.65-0.80;
  # model-bill matches a touch lower due to state-specific statute paraphrasing.
  similarity_thresholds:
    bill_clustering: 0.65
    model_bill_match: 0.55

  scoring:
    alert_threshold: 70
    watchlist_threshold: 50

  weights:
    signal_a:
      cluster_size: 0.30
      lda_recency: 0.20
      icp_company_count: 0.30
      cluster_cohesion: 0.20

    signal_c:
      filing_recency: 0.30
      bill_count: 0.20
      bill_stage: 0.30
      match_specificity: 0.20

    signal_d:
      propagation_count: 0.40
      acceleration: 0.30
      similarity: 0.15
      icp_topic_match: 0.15

    signal_e:
      sign_rate: 0.45         # the headline number — high sign rate dominates
      sample_size: 0.15       # more historical bills = more reliable
      bill_stage: 0.20        # closer to passage = more urgent
      icp_topic_match: 0.20
