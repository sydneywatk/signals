[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signals"
version = "0.1.0"
description = "GTM signal pipeline detecting buying moments for State Affairs sales team"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Sydney Watkins", email = "sydney.watkins@gmail.com" },
]
dependencies = [
  "httpx>=0.27",
  "anthropic>=0.40",
  "edgartools>=2.5",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "tenacity>=8.2",
  "lxml>=5.0",
  "beautifulsoup4>=4.12",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "scikit-learn>=1.4",
  "numpy>=1.26",
  "voyageai>=0.3",
  "sentence-transformers>=2.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
