name: Pipeline run

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:        # manual trigger from Actions UI

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pipeline (live mode)
        env:
          USE_LIVE_APIS: "true"
          OPENSTATES_API_KEY: ${{ secrets.OPENSTATES_API_KEY }}
          LDA_API_KEY: ${{ secrets.LDA_API_KEY }}
          LDA_BASE_URL: ${{ secrets.LDA_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python -m signals.main

      - name: Upload watchlist artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watchlist-${{ github.run_id }}
          path: |
            data/watchlist.jsonl
            data/last_run.json
          if-no-files-found: ignore
          retention-days: 14
