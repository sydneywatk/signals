name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test (fixtures-only — no API keys needed)
        env:
          USE_LIVE_APIS: "false"
        run: pytest -v

      - name: Smoke run (fixtures)
        env:
          USE_LIVE_APIS: "false"
        run: python -m signals.main
